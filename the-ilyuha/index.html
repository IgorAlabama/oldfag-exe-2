<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The Ильюха — загрузка</title><style>html,body{margin:0;width:100%;height:100%;background:#081323;color:#ffda77;font:16px monospace;display:grid;place-items:center}#status{text-align:center;padding:25px}</style></head><body><div id="status">THE ИЛЬЮХА<br><br>ЗАГРУЗКА ИГРЫ…<br><span id="pct">0%</span></div><script>
const parts=["parts/g0_000.txt","parts/g0_001.txt","parts/g0_002.txt","parts/g0_003.txt","parts/g0_004.txt","parts/g0_005.txt","parts/g0_006.txt","parts/g0_007.txt","parts/g0_008.txt","parts/g0_009.txt","parts/g0_010.txt","parts/g0_011.txt","parts/g0_012.txt","parts/g0_013.txt","parts/g0_014.txt","parts/g1_000.txt","parts/g1_001.txt","parts/g1_002.txt","parts/g1_003.txt","parts/g1_004.txt","parts/g1_005.txt","parts/g1_006.txt","parts/g1_007.txt","parts/g1_008.txt","parts/g1_009.txt","parts/g1_010.txt","parts/g1_011.txt","parts/g1_012.txt","parts/g1_013.txt","parts/g1_014.txt","parts/g1_015.txt","parts/g1_016.txt","parts/g1_017.txt","parts/g1_018.txt","parts/g1_019.txt","parts/g1_020.txt","parts/g2_000.txt","parts/g2_001.txt","parts/g2_002.txt","parts/g2_003.txt","parts/g2_004.txt","parts/g2_005.txt","parts/g2_006.txt","parts/g3_000.txt","parts/g3_001.txt","parts/g3_002.txt","parts/g3_003.txt","parts/g3_004.txt","parts/g3_005.txt","parts/g3_006.txt","parts/g3_007.txt","parts/g3_008.txt","parts/g3_009.txt","parts/g3_010.txt","parts/g3_011.txt","parts/g3_012.txt"];
(async()=>{try{const chunks=new Array(parts.length);let n=0;for(let start=0;start<parts.length;start+=6){await Promise.all(parts.slice(start,start+6).map(async(p,j)=>{const r=await fetch(p);if(!r.ok)throw Error(p+' HTTP '+r.status);chunks[start+j]=await r.text();document.getElementById('pct').textContent=Math.round(++n/parts.length*100)+'%';}));}const html=chunks.join('').replace('</head>','<link rel="stylesheet" href="release.css"></head>').replace('</body>','<'+'script src="sfx.js"></'+'script><'+'script src="music.js"></'+'script></body>');if(!html.includes('id="mainMenu"')||!html.includes('</html>'))throw Error('Неполная сборка игры');document.open();document.write(html);document.close();}catch(e){document.getElementById('status').textContent='Не удалось загрузить игру: '+e.message;console.error(e);}})();
</script></body></html>
