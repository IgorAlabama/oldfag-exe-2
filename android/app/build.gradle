plugins {
    id 'com.android.application'
}
android {
    namespace 'exe.oldfag.arcade'
    compileSdk 36

    defaultConfig {
        applicationId 'exe.oldfag.arcade'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '0.3.8'
    }

    signingConfigs {
        debug {
            storeFile file('../.signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Embedded game MP3 and other already-compressed assets should remain compressed.
    androidResources {
        noCompress += ['mp3', 'ogg', 'webp']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}
