name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
      - 'index.html'
      - 'app.js'
      - 'club.js'
      - 'progress.js'
      - 'progress.css'
      - 'arcade/**'
      - 'krymskiy-chai/**'
      - 'toffi-rage/**'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out all game files
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Bundle website and games for offline play
        shell: bash
        run: |
          set -euo pipefail
          dest=android/app/src/main/assets/site
          mkdir -p "$dest"
          for f in index.html styles.css club.css app.js club.js questions.js audio.js arthur-dialogues.js club-questions.js progress.js progress.css; do
            test -s "$f" || { echo "Missing website file: $f"; exit 1; }
            cp "$f" "$dest/"
          done
          for dir in assets arcade krymskiy-chai toffi-rage; do
            test -d "$dir" || { echo "Missing game folder: $dir"; exit 1; }
            cp -R "$dir" "$dest/"
          done
          test -s "$dest/club.js" || { echo "CRITICAL: club.js is missing from APK source"; exit 1; }
          test -s "$dest/toffi-rage/music/toffiksorekhim8bit.mp3"
          test -s "$dest/toffi-rage/music/plokhayamarzha8bit.mp3"
          test -s "$dest/arcade/assets/zachem8bit.mp3"
          test -s "$dest/krymskiy-chai/assets/vstolovkuda8bit.mp3"
          python3 android/build-site.py
          test -s "$dest/android-arcade-shell.js"
          test -s "$dest/android-game-timur.css"
          test -s "$dest/android-game-tea.css"
          test -s "$dest/android-toffi-mobile-b2.js"
          test -s "$dest/android-toffi-mobile-b2.css"
          grep -Fq '../android-toffi-mobile-b2.js' "$dest/toffi-rage/index.html"
          echo "Bundled files:"
          du -sh "$dest"
      # Keep a dedicated signing identity across future Android betas.
      # Caching is for test builds only; the release key belongs in GitHub Secrets.
      - name: Restore persistent test signing key
        uses: actions/cache@v4
        with:
          path: android/.signing/debug.keystore
          key: oldfag-android-debug-signing-v2
      - name: Create test signing key once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/.signing
          if [ ! -f android/.signing/debug.keystore ]; then
            keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore android/.signing/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=OLDfag Android Beta,O=Last of Games,C=US"
          fi
      - name: Build Android debug APK
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Verify APK includes essential scripts
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$apk" | grep -Fxq 'assets/site/club.js'
          unzip -Z1 "$apk" | grep -Fxq 'assets/site/app.js'
          unzip -Z1 "$apk" | grep -Fxq 'assets/site/progress.js'
          unzip -Z1 "$apk" | grep -Fxq 'assets/site/android-arcade-shell.js'
          unzip -Z1 "$apk" | grep -Fxq 'assets/site/android-game-timur.css'
          unzip -Z1 "$apk" | grep -Fxq 'assets/site/android-game-tea.css'
          unzip -Z1 "$apk" | grep -Fxq 'assets/site/android-toffi-mobile-b2.js'
          unzip -Z1 "$apk" | grep -Fxq 'assets/site/android-toffi-mobile-b2.css'
          echo "Main, club, and progress scripts are inside the APK."
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OLDfag-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
